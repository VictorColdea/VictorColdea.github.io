<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V.Cold. — Photography</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <h1 class="site-title">V.COLDEA<span class="site-title-sub">&nbsp;/&nbsp;PHOTOGRAPHY</span></h1>
  <a class="nav-link" href="about.html">About</a>
  <nav class="filters" id="filters">
    <!-- Buttons are generated by script.js from the tags on your photos -->
  </nav>
</header>

<main class="gallery" id="gallery">
  <!-- Photo cards are injected by script.js from the PHOTOS array -->
</main>

<footer class="site-footer">
  <p>Shot on Google Pixel 6 Pro. <span class="footer-mono">&copy; <span id="year"></span></span></p>
</footer>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo detail">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous photo">&#8249;</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next photo">&#8250;</button>
  <div class="lightbox-content">
    <div class="lightbox-image-wrap" id="lightboxImageWrap"></div>
    <aside class="lightbox-panel">
      <div class="lightbox-frame" id="lightboxFrame"></div>
      <p class="lightbox-meta" id="lightboxMeta"></p>
      <p class="lightbox-desc" id="lightboxDesc"></p>
      <div class="lightbox-tags" id="lightboxTags"></div>
    </aside>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
